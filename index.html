<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InesBot V1</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>InesBotV1</h1>
                <p>We ALL fw this, right?</p>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="light-icon">☀️</span>
                <span class="dark-icon">🌙</span>
            </button>
        </header>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Words loaded:</span>
                <span class="stat-value" id="word-count">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Results found:</span>
                <span class="stat-value" id="result-count">0</span>
            </div>
        </div>

        <div class="control-panel">
            <!-- Removed the Load Words button -->
            
            <div class="search-filters">
                <div class="filter-group">
                    <label for="prefix-input">Starts with:</label>
                    <input type="text" id="prefix-input" placeholder="e.g., 'ly'" class="filter-input">
                </div>
                
                <div class="filter-group">
                    <label for="suffix-input">Ends with:</label>
                    <input type="text" id="suffix-input" placeholder="e.g., 'ines'" class="filter-input">
                </div>
            </div>

            <div class="sort-options">
                <span class="sort-label">Sort by:</span>
                <label class="radio-label">
                    <input type="radio" name="sort" value="none" checked> Default
                </label>
                <label class="radio-label">
                    <input type="radio" name="sort" value="shortest"> Shortest First
                </label>
                <label class="radio-label">
                    <input type="radio" name="sort" value="longest"> Longest First
                </label>
                <label class="radio-label">
                    <input type="radio" name="sort" value="alpha"> Alphabetical
                </label>
            </div>

            <div class="action-buttons">
                <button id="search-btn" class="btn btn-search">Search</button>
                <button id="clear-btn" class="btn btn-clear">Clear All</button>
            </div>
        </div>

        <div class="results-container">
            <div id="results-box" class="results-box">
                <p class="placeholder-text">Loading words from GitHub...</p>
            </div>
        </div>

        <footer>
            <p>Mountain Peak</p>
        </footer>
    </div>
    <script src="script.js"></script>
    <!-- Rare Prefix Finder Feature -->
<div class="rare-prefix-section">
    <div class="rare-prefix-header" onclick="toggleRarePrefixPanel()">
        <h3>🔍 Rare Prefix Finder <span class="toggle-icon">▼</span></h3>
        <p class="rare-prefix-description">Find prefixes with few words (great for word games!)</p>
    </div>
    
    <div id="rare-prefix-panel" class="rare-prefix-panel">
        <div class="rare-prefix-controls">
            <div class="rare-prefix-row">
                <label for="prefix-length">Prefix length:</label>
                <select id="prefix-length" class="rare-prefix-select">
                    <option value="2">2 letters</option>
                    <option value="3" selected>3 letters</option>
                    <option value="4">4 letters</option>
                </select>
            </div>
            
            <div class="rare-prefix-row">
                <label for="max-words">Max words (rare if ≤):</label>
                <select id="max-words" class="rare-prefix-select">
                    <option value="5">5 words</option>
                    <option value="6" selected>6 words</option>
                    <option value="7">7 words</option>
                    <option value="8">8 words</option>
                </select>
            </div>
            
            <div class="rare-prefix-row">
                <label for="min-words">Min words (optional):</label>
                <select id="min-words" class="rare-prefix-select">
                    <option value="1">1 word (rarest)</option>
                    <option value="2">2+ words</option>
                    <option value="3">3+ words</option>
                </select>
            </div>
            
            <button id="find-rare-prefixes-btn" class="btn btn-search" style="width: 100%; margin-top: 10px;">
                🔍 Find Rare Prefixes
            </button>
        </div>
        
        <div id="rare-prefix-results" class="rare-prefix-results">
            <p class="placeholder-text">Click the button to analyze your word list...</p>
        </div>
    </div>
</div>
</body>
</html>
